[project]
name = "ecg5000-classification"
version = "0.1.0"
description = "Minimal, general Python project scaffold."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jupyterlab>=4.6.3",
    "numpy>=2.4.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecg500"]

[tool.ruff]
line-length = 100
target-version = "py311"

